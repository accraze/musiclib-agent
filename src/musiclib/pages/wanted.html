<title>Wanted List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky search/filter bar over one column of entries, grouped by why they're wanted. */
:root {
  --bg: #f4f4f1; --surface: #ffffff; --fg: #1c1d1f; --muted: #66686c; --line: #dcdcd6;
  --accent: #1f6f8b; --accent-soft: #e2eff3; --hurt: #a3361f; --hurt-soft: #f8e5df; --low: #8a5a17; --low-soft: #f6ecdc;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141618; --surface: #1c1f22; --fg: #e9e8e4; --muted: #9a9da1; --line: #2e3236;
  --accent: #63b4d1; --accent-soft: #17323d; --hurt: #ec8a73; --hurt-soft: #3d1f18; --low: #e0a85a; --low-soft: #3a2b16; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141618; --surface: #1c1f22; --fg: #e9e8e4; --muted: #9a9da1; --line: #2e3236;
  --accent: #63b4d1; --accent-soft: #17323d; --hurt: #ec8a73; --hurt-soft: #3d1f18; --low: #e0a85a; --low-soft: #3a2b16; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 20px; }
header { display: grid; gap: 8px; }
h1 { font: 700 clamp(26px, 4vw, 36px)/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
.lede { margin: 0; color: var(--muted); max-width: 64ch; }
.stamp { font: 12px var(--mono); color: var(--muted); }
.bar { display: grid; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg);
  padding-block: 10px; z-index: 2; border-bottom: 1px solid var(--line); }
.bar input { font: 15px var(--body); padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--fg); width: 100%; box-sizing: border-box; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 5px 12px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
section h2 { font: 600 18px/1.2 var(--display); margin: 8px 0 4px; }
section > p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
li { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px;
  padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: start; }
li.damaged, li.damaged_file { border-left-color: var(--hurt); }
li.low_bitrate { border-left-color: var(--low); }
.name { font-weight: 700; overflow-wrap: anywhere; }
.name span { font-weight: 400; color: var(--muted); }
.why { grid-column: 1; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.why a { color: var(--accent); }
.why .note { color: var(--fg); font-style: italic; }
.copy { grid-row: 1 / span 2; grid-column: 2; font: 500 12px var(--body); border: 1px solid var(--line);
  background: transparent; color: var(--fg); padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.copy:hover { border-color: var(--accent); }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }
</style>

<div class="wrap">
  <header>
    <h1>Wanted List</h1>
    <p class="lede">Albums to find a better copy of. Drop one into the inbox and the import asks before replacing the copy in the library; an entry comes off this list by itself once its replacement is in.</p>
    <span class="stamp" id="stamp"></span>
  </header>
  <div class="bar">
    <input type="search" id="q" placeholder="Filter by artist or album" aria-label="Filter by artist or album">
    <div class="filters" role="group" aria-label="Show" id="filters"></div>
  </div>
  <main id="list"></main>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const KINDS = [
    ["manual", "Your picks", "Added by hand."],
    ["damaged", "Damaged albums", "Tracks that stop early or won't decode in full."],
    ["damaged_file", "Damaged singles in Unsorted", "One file each; replace the file, then remove the damaged one."],
    ["low_bitrate", "Low bitrate", "Averaging under 120 kbps."],
  ];
  const entries = DATA.entries;
  let kind = "all";
  const $ = (id) => document.getElementById(id);

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
    }
    for (const k of kids) if (k) e.append(k);
    return e;
  }
  const label = (e) => e.artist ? `${e.artist} ${e.album}` : e.album;

  const when = new Date(DATA.generated);
  $("stamp").textContent = `${entries.length} open · updated ${isNaN(when) ? DATA.generated : when.toLocaleString()}`;

  function filters() {
    const f = $("filters"); f.innerHTML = "";
    const opts = [["all", "All", entries.length], ...KINDS.map(([k, name]) => [k, name, entries.filter(e => e.kind === k).length])];
    for (const [k, name, n] of opts) {
      if (k !== "all" && !n) continue;
      f.append(el("button", { type: "button", "aria-pressed": String(kind === k),
        onclick: () => { kind = k; filters(); render(); } }, `${name} ${n}`));
    }
  }

  async function copy(btn, text) {
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
    catch { btn.textContent = "Can't copy"; }
    setTimeout(() => { btn.textContent = "Copy"; }, 1500);
  }

  function render() {
    const q = $("q").value.trim().toLowerCase();
    const list = $("list"); list.innerHTML = "";
    let shown = 0;
    for (const [k, name, blurb] of KINDS) {
      if (kind !== "all" && kind !== k) continue;
      const rows = entries.filter(e => e.kind === k && (!q || label(e).toLowerCase().includes(q)));
      if (!rows.length) continue;
      shown += rows.length;
      const ul = el("ul");
      for (const e of rows) {
        const why = el("div", { class: "why" }, el("span", { text: e.detail || "" }),
          e.note ? el("span", { class: "note", text: e.note }) : null,
          e.mb_albumid ? el("a", { href: `https://musicbrainz.org/release/${e.mb_albumid}`, target: "_blank", rel: "noopener", text: "MusicBrainz" }) : null);
        const name = el("div", { class: "name" }, e.artist ? `${e.artist} ` : "", e.artist ? el("span", { text: "— " }) : null, e.album);
        const btn = el("button", { type: "button", class: "copy", "aria-label": `Copy ${label(e)}` }, "Copy");
        btn.addEventListener("click", () => copy(btn, label(e)));
        ul.append(el("li", { class: e.kind }, name, btn, why));
      }
      list.append(el("section", { "aria-label": name }, el("h2", { text: `${name} (${rows.length})` }), el("p", { text: blurb }), ul));
    }
    if (!shown) list.append(el("p", { class: "empty", text: entries.length ? "Nothing matches that filter." : "Nothing is wanted right now." }));
  }

  $("q").addEventListener("input", render);
  filters(); render();
})();
</script>
