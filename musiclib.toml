# musiclib configuration. Paths may use ~.

# The unsorted dump. Treated as strictly read-only (SPEC: Safety rules #1).
source_dir = "/srv/data/media/music"

# Where the state DB and reports live (gitignored).
state_dir = "state"

# The clean library root (outside the dump). Created on first import.
library_dir = "/srv/data/media/music-library"

# New folders to ingest (D27). Outside the dump and the library; claimed folders move to
# .processed/<date>/ inside it (D28) and are read-only from then on.
inbox_dir = "/srv/data/media/music-inbox"
